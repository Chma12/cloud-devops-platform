name: Cloud DevOps CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -v

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t task-manager-api .

      - name: Smoke test (the container starts and answers)
        run: |
          docker run -d --name api -p 8000:8000 task-manager-api
          for i in $(seq 1 10); do
            if curl -fs http://localhost:8000/health; then exit 0; fi
            sleep 2
          done
          docker logs api
          exit 1
